# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      # RcppParallel 6.0.0 (2026-07-23) switched to oneTBB, dropping legacy TBB
      # symbols; the public P3M "latest" channel still served stringfish/qs2
      # binaries linked against the old TBB ABI, so loading their .so fails with
      # an undefined TBB symbol at install time. Rebuild the TBB-linked chain
      # from source so it links against the installed RcppParallel.
      - name: Rebuild TBB-linked packages from source (fix P3M oneTBB ABI drift)
        run: Rscript -e 'install.packages(c("stringfish", "qs2"), type = "source")'

      - name: Run Zh formula regression tests
        run: |
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'
          Rscript -e 'library(kaefa); testthat::test_file("tests/testthat/test-zh-misfit-decision-rule.R")'

      - uses: r-lib/actions/check-r-package@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          error-on: '"error"'
          upload-snapshots: true
          args: 'c("--no-manual", "--no-tests")'
          build_args: 'c("--no-manual")'
