name: test-fast

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-fast:
    # Pin to jammy (22.04): noble (24.04) ubuntu-latest source-builds the
    # mirt -> ... -> stringfish chain, whose stringfish.so then fails to load
    # with an Intel TBB ABI mismatch, aborting `R CMD INSTALL .`. P3M ships
    # jammy binaries that avoid the source compile. Same pin as test-suite.yaml
    # and aFIPC's r.yml; revisit once P3M ships noble binaries.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Install kaefa package for fast tests
        run: R CMD INSTALL .

      - name: Run fast productization tests
        run: |
          Rscript - <<'RSCRIPT'
          reporter <- testthat::StopReporter$new()
          testthat::test_file("tests/testthat/test-benchmark-manifest.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-shiny-product-surface.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-core-api-contract.R",
                              reporter = reporter)
          RSCRIPT
