name: test-fast

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-fast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          extra-packages: any::testthat
          needs: check

      # RcppParallel 6.0.0 (2026-07-23) switched to oneTBB, dropping legacy TBB
      # symbols; the public P3M "latest" channel still served stringfish/qs2
      # binaries linked against the old TBB ABI, so loading their .so fails with
      # an undefined TBB symbol at install time. Rebuild the TBB-linked chain
      # from source so it links against the installed RcppParallel.
      - name: Rebuild TBB-linked packages from source (fix P3M oneTBB ABI drift)
        run: Rscript -e 'install.packages(c("stringfish", "qs2"), type = "source")'

      - name: Install kaefa package for fast tests
        run: R CMD INSTALL .

      - name: Run fast productization tests
        run: |
          Rscript - <<'RSCRIPT'
          reporter <- testthat::StopReporter$new()
          testthat::test_file("tests/testthat/test-benchmark-manifest.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-shiny-product-surface.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-core-api-contract.R",
                              reporter = reporter)
          RSCRIPT
