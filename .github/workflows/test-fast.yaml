name: test-fast

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-fast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2
        with:
          # ponytail: RcppParallel 6.2.0 (oneTBB) broke the ABI of prebuilt
          # qs2/stringfish binaries (undefined tbb::internal symbols). Build both
          # from source and bust the package cache; drop these two refs and
          # cache-version once CRAN/PPM binaries are rebuilt against 6.2.0.
          cache-version: 2
          extra-packages: |
            any::testthat
            stringfish=?source
            qs2=?source
          needs: check

      - name: Install kaefa package for fast tests
        run: R CMD INSTALL .

      - name: Run fast productization tests
        run: |
          Rscript - <<'RSCRIPT'
          reporter <- testthat::StopReporter$new()
          testthat::test_file("tests/testthat/test-benchmark-manifest.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-shiny-product-surface.R",
                              reporter = reporter)
          testthat::test_file("tests/testthat/test-core-api-contract.R",
                              reporter = reporter)
          RSCRIPT
